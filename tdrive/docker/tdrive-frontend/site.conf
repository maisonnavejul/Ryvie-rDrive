# --- same-origin helpers (valides ici : ce fichier est inclus dans http{}) ---
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
# Respecte le X-Forwarded-Proto entrant (proxy externe HTTPS -> :3010 http), sinon $scheme
map $http_x_forwarded_proto $fwd_proto {
  default $scheme;
  "~.+"   $http_x_forwarded_proto;
}

server {
  listen ${NGINX_LISTEN};
  ssl_dhparam /etc/nginx/ssl/dhparam.pem;
  ssl_certificate /etc/nginx/ssl/selfsigned.crt;
  ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

  server_name _;
  # Serve the built React app
  root /tdrive-react/build;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000";

  location /.well-known {
      root /tdrive-react/build;

      gzip on;
      gzip_disable "msie6";

      add_header Cache-Control "no-store, public, max-age=0";
      add_header Cross-Origin-Opener-Policy 'same-origin-allow-popups; report-to="DurableDeepLinkUi"';
      add_header Cross-Origin-Resource-Policy "same-site";
      add_header Content-Type "application/json; charset=utf-8";
      add_header Last-Modified "";
      add_header Vary "Sec-Fetch-Dest, Sec-Fetch-Mode, Sec-Fetch-Site";
      add_header X-Content-Type-Options "nosniff";
      add_header X-Frame-Options "SAMEORIGIN";
      add_header X-XSS-Protection "0";

      proxy_buffering off;
      if_modified_since off;
      expires 0s;
      allow all;

      try_files $uri /index.html;
  }

  # config.js et index.html : jamais mis en cache (sinon ancien bundle/config same-origin servi)
  location = /config.js {
      root /tdrive-react/build;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
      expires -1;
      try_files $uri =404;
  }
  location = /index.html {
      root /tdrive-react/build;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
      expires -1;
      try_files $uri =404;
  }

  # Serve favicon.ico; fallback to PNG if ICO missing
  location = /favicon.ico {
      root /tdrive-react/build;
      try_files /favicon.ico /favicon.png =204;
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # --- OnlyOffice Document Server (même origine, sous-chemin) ---
  location /onlyoffice-ds/ {
      proxy_pass ${ONLYOFFICE_DOCUMENT_SERVER_HOST}/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
  }

  # --- OnlyOffice Document Server: cache des documents convertis (URL racine /cache/...) ---
  # Le DS génère l'URL du document converti (Editor.bin) en chemin racine /cache/files/...,
  # pas sous /onlyoffice-ds/ : on la route explicitement vers le Document Server.
  location /cache/ {
      proxy_pass ${ONLYOFFICE_DOCUMENT_SERVER_HOST};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
  }

  # --- WebSocket / socket.io -> node ---
  location ~ ^/(ws|socket\.io)(/|$) {
      proxy_pass ${NODE_HOST};
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
  }

  # /plugins/onlyoffice SANS slash final (généré par le bundle) : on ajoute le slash en
  # redirection RELATIVE (absolute_redirect off) pour préserver l'origine (host:port).
  # Sinon ça tombe sur le backend node, qui répond un 301 ABSOLU en port 80 (drop du port).
  location = /plugins/onlyoffice {
      absolute_redirect off;
      return 308 /plugins/onlyoffice/$is_args$args;
  }

  location ^~ /plugins/onlyoffice/ {
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${ONLYOFFICE_CONNECTOR_HOST};
  }

  location ~ ^/(internal|plugins).* {
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${NODE_HOST};
  }

  location ~ ^/(api|administration/v2/).* {
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 600s;
      proxy_pass ${NODE_HOST};
  }

  location ~ ^/(ajax|api|administration|upload|bundle|medias).* {
      # try to serve file directly, fallback to rewrite
      try_files $uri @rewriteapp;
  }

  location / {
      gzip on;
      gzip_disable "msie6";

      gzip_comp_level 6;
      gzip_min_length 1100;
      gzip_buffers 16 8k;
      gzip_proxied any;
      gzip_types
          text/plain
          text/css
          text/js
          text/xml
          text/javascript
          application/javascript
          application/x-javascript
          application/json
          application/xml
          application/rss+xml
          image/svg+xml;
      root /tdrive-react/build;
      allow all;
      try_files $uri /index.html;
  }

}
